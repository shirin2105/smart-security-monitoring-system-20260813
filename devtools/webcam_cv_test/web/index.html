<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Webcam CV Test</title>
  <style>
    body{font-family:system-ui;margin:20px;background:#111;color:#eee}main{max-width:960px;margin:auto}
    img{width:100%;background:#222;border:1px solid #555}pre{background:#222;padding:12px;white-space:pre-wrap}
    button{margin:4px;padding:8px 14px}
  </style>
</head>
<body><main>
  <h1>Webcam CV Test</h1>
  <img src="/video_feed" alt="Live webcam stream">
  <pre id="status">Starting…</pre>
  <button onclick="call('/start')">Start Camera</button>
  <button onclick="call('/stop')">Stop Camera</button>
  <button onclick="call('/events/clear')">Clear Event Log</button>
</main><script>
async function call(path){await fetch(path,{method:'POST'})}
async function refresh(){
  const s=await fetch('/status').then(r=>r.json());
  document.getElementById('status').textContent =
    `FPS: ${s.fps.toFixed(1)}\nDetector: ${s.detector_latency_ms.toFixed(1)} ms\n`+
    `Pipeline: ${s.pipeline_latency_ms.toFixed(1)} ms\n`+
    `Persons: ${s.persons}\nCrowd: ${s.crowd_active?'ACTIVE':'NORMAL'}\n`+
    `Intrusion: ${s.intrusion_track_ids.join(', ')||'NONE'}\n`+
    `Abandoned: ${s.abandoned_candidate_ids.join(', ')||'NONE'}\n`+
    `Frames: ${s.processed_frames}\nDropped: ${s.dropped_frames}\n`+
    (s.error?`Error: ${s.error}`:'');
}
setInterval(()=>refresh().catch(()=>{}),500); refresh();
</script></body></html>
