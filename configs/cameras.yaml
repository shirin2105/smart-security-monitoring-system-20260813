cameras:
  - camera_id: cam_01
    name: Cổng kỹ thuật
    source_type: SIMULATED
    source_uri: ./tests/clips/walking_people.mp4
    location: Gate A
    inference_fps: 5
    enabled: true

  - camera_id: cam_02
    name: Sảnh chính
    source_type: SIMULATED
    source_uri: ./tests/clips/aboda-video1.mp4
    location: Lobby
    inference_fps: 5
    enabled: true

  - camera_id: cam_03
    name: Hàng rào Tây
    source_type: SIMULATED
    source_uri: ./tests/clips/pets2006_3.mp4
    location: Fence / Yard
    inference_fps: 5
    enabled: true

  - camera_id: rtsp_test_01
    name: RTSP Test Camera
    source_type: RTSP
    source_uri: ${RTSP_TEST_URL}
    inference_fps: 5
    enabled: false
    rtsp:
      open_timeout_ms: 5000
      read_timeout_ms: 5000
    reconnect:
      enabled: true
      initial_backoff_s: 1.0
      max_backoff_s: 15.0
      multiplier: 2.0
    continuity:
      grace_s: 3.0
      reset_after_s: 5.0
