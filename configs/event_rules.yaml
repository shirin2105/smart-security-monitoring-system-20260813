      luggage_rolling_high_ratio: 0.20
      luggage_min_rolling_good_ratio: 0.20
      luggage_min_global_high_ratio: 0.20
    stitch:
      max_gap_s: 1.2
      max_center_distance_px: 120.0
      max_normalized_distance: 1.5
    stationary:
