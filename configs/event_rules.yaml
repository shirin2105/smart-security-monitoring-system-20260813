intrusion:
  dwell_seconds: 2.0
  exit_grace_seconds: 1.0
  cooldown_seconds: 30

crowd:
  count_threshold: 8
  hold_seconds: 10
  release_threshold: 5
  cooldown_seconds: 60

abandoned_object:
  candidate_source: static_regions
  allowed_classes:
    - backpack
    - handbag
    - suitcase
  stationary_seconds: 15
  stationary_pixel_threshold: 12
  owner_association_distance: 150
  owner_absent_seconds: 10
  cooldown_seconds: 60
  temporal:
    enabled: true
    pre_seconds: 8
    post_seconds: 8
    sample_fps: 1
    max_frames: 17
    buffer_max_dimension: 480
    buffer_byte_ceiling: 12000000
  vlm:
    mode: huggingface
    model: google/gemma-3-4b-it
    timeout_seconds: 8
  static_region:
    warmup_seconds: 2
    stationary_seconds: 15
    clear_grace_seconds: 2
    min_area_ratio: 0.001
    max_area_ratio: 0.25
    foreground_threshold: 25
    morphology_kernel: 3
    match_iou: 0.25
    learning_rate: 0.05
