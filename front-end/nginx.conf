server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA dùng BrowserRouter: mọi đường dẫn sâu (/incidents/101) phải trả về
    # index.html để React Router tự định tuyến, nếu không nginx sẽ trả 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy static media video clips sang backend container
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # index.html không được cache, nếu không người dùng giữ bản build cũ.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
