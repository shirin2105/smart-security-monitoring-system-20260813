server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA dùng BrowserRouter: mọi đường dẫn sâu (/incidents/101) phải trả về
    # index.html để React Router tự định tuyến, nếu không nginx sẽ trả 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html không được cache, nếu không người dùng giữ bản build cũ.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
