name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (app/ + back-end/)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ back-end/app/ tests/ scripts/

      - name: Run tests (app/)
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Run tests (back-end/)
        run: |
          cd back-end
          pytest tests/ -v --tb=short
        env:
          APP_ENV: test

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front-end

      - name: Type check
        run: npx tsc --noEmit
        working-directory: front-end

      - name: Run tests
        run: npm run test
        working-directory: front-end

      - name: Build
        run: npm run build
        working-directory: front-end
