version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: security_monitoring_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: security_monitoring_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/security_db
      - JWT_SECRET=super-secret-security-monitoring-key-2026
      - EVENT_INGEST_TOKEN=${EVENT_INGEST_TOKEN:?EVENT_INGEST_TOKEN must be set and non-empty}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        # Địa chỉ trình duyệt dùng để gọi backend (cổng đã publish ra host),
        # không phải hostname nội bộ `backend` của docker network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_USE_MOCK: "false"
    container_name: security_monitoring_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
